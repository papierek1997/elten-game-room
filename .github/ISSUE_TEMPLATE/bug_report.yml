name: Bug report
description: Report a reproducible problem in ELTEN Game Room
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and build
      placeholder: "e.g. 1.1.0, build 176"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game or screen
      placeholder: "e.g. Ninety-Nine, lobby, invitations"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe exactly what you do, starting from launching the application.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or additional information
      description: Remove tokens, private messages and unnecessary user data.
      render: text
