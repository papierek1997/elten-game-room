name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [models, transport, ui, native, tooling, integration]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned Elten test host
        uses: actions/checkout@v7
        with:
          repository: dawidpieper/elten3
          ref: 3418d67dea40ee116f4a8ba545b1c409fd04706f
          path: .ci/elten3
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install translation authoring tools
        run: bundle install --gemfile tools/Gemfile.i18n
      - name: Install audio validation tools
        if: matrix.suite == 'tooling'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - name: Install native package test dependencies
        if: matrix.suite == 'native'
        run: |
          gem install rubyzip --version 3.2.2 --no-document
          gem install zstd-ruby --version 2.0.6 --no-document
      - name: Check compiled translations and translated documents
        run: ruby tools/translations.rb check
      - name: Check generated runtime sources
        run: |
          ruby tools/compile-rulebooks.rb --check
          ruby tools/generate-krowa-nouns.rb --check
      - name: Run tests
        env:
          ELTEN_HOST_SOURCE: ${{ github.workspace }}/.ci/elten3
        run: ruby test/run.rb --suite ${{ matrix.suite }} --report test-results.json
      - name: Preserve scenario results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results.json
          if-no-files-found: error
          retention-days: 14
