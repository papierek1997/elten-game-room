name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [models, transport, ui, native, tooling, integration]
        part: [1]
        parts: [1]
        include:
          - {suite: tournaments, part: 1, parts: 4}
          - {suite: tournaments, part: 2, parts: 4}
          - {suite: tournaments, part: 3, parts: 4}
          - {suite: tournaments, part: 4, parts: 4}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned Elten test host
        uses: actions/checkout@v7
        with:
          repository: dawidpieper/elten3
          ref: f29e82a0c32c66b1eca5e6fa5e5e7b858b61f480
          path: .ci/elten3
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install translation authoring tools
        run: bundle install --gemfile tools/Gemfile.i18n
      - name: Install audio validation tools
        if: matrix.suite == 'tooling'
        run: |
          function Test-AudioTools {
            return (Get-Command ffmpeg -CommandType Application -ErrorAction SilentlyContinue) -and
              (Get-Command ffprobe -CommandType Application -ErrorAction SilentlyContinue)
          }
          if (-not (Test-AudioTools)) {
            # The same publisher as Chocolatey's essentials package, without
            # depending on the package feed. Pin both the archive and its hash.
            $audioVersion = '9.0.2'
            $audioSha256 = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
            $audioRoot = Join-Path $env:RUNNER_TEMP "power-games-ffmpeg-$audioVersion"
            $audioArchive = Join-Path $audioRoot 'ffmpeg.zip'
            $audioBin = Join-Path $audioRoot "ffmpeg-$audioVersion-essentials_build/bin"
            New-Item -ItemType Directory -Force -Path $audioRoot | Out-Null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$audioVersion-essentials_build.zip" -OutFile $audioArchive -TimeoutSec 600
                if ((Get-FileHash -LiteralPath $audioArchive -Algorithm SHA256).Hash -ne $audioSha256) {
                  throw 'FFmpeg archive checksum mismatch.'
                }
                Expand-Archive -LiteralPath $audioArchive -DestinationPath $audioRoot -Force
                foreach ($tool in @('ffmpeg', 'ffprobe')) {
                  if (-not (Test-Path -LiteralPath (Join-Path $audioBin "$tool.exe") -PathType Leaf)) {
                    throw "The archive does not contain $tool.exe."
                  }
                }
                $env:PATH = "$audioBin;$env:PATH"
                Add-Content -LiteralPath $env:GITHUB_PATH -Value $audioBin -Encoding utf8
                if (Test-AudioTools) { break }
              } catch {
                Write-Warning "Audio tool installation failed: $_"
              }
              if ($attempt -eq 3) { throw 'FFmpeg and FFprobe are unavailable after three installation attempts.' }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            & $tool -version
            if ($LASTEXITCODE -ne 0) { throw "$tool cannot run." }
          }
      - name: Install shared runtime test dependencies
        run: gem install rubyzip --version 3.2.2 --no-document
      - name: Install native package test dependencies
        if: matrix.suite == 'native'
        run: |
          gem install zstd-ruby --version 2.0.6 --no-document
      - name: Check compiled translations and translated documents
        run: ruby tools/translations.rb check
      - name: Check generated runtime sources
        run: |
          ruby tools/compile-rulebooks.rb --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruby tools/generate-krowa-nouns.rb --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run tests
        env:
          ELTEN_HOST_SOURCE: ${{ github.workspace }}/.ci/elten3
        run: ruby test/run.rb --suite ${{ matrix.suite }} --shard ${{ matrix.part }}/${{ matrix.parts }} --report test-results.json
      - name: Preserve scenario results
        if: always() && hashFiles('test-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.part }}
          path: test-results.json
          if-no-files-found: error
          retention-days: 14
